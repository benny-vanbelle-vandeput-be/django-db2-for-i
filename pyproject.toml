[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-db2-for-i"
dynamic = ["version"]
description = "Django database backend for Db2 for IBM i"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Benny Van Belle" }]
requires-python = ">=3.12"
# pyodbc is required while it is the only driver; it becomes an extra once a
# second driver exists (see docs/DECISIONS.md).
dependencies = [
    "Django>=6.1,<6.2",
    "pyodbc>=5.3",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
keywords = ["django", "db2", "ibm i", "as400", "iseries", "odbc"]

[dependency-groups]
test = ["pytest>=9", "pytest-django>=4.11"]
lint = ["ruff>=0.15"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.hatch.version]
path = "django_db2_for_i/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["django_db2_for_i", "tests", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["django_db2_for_i"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Offline settings by default; the pub400 nox session passes --ds.
DJANGO_SETTINGS_MODULE = "tests.django_settings.settings_offline"
django_find_project = false
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "offline: no IBM i needed; never opens a database connection",
    "pub400: curated smoke set for a shared, restricted IBM i (PUB400)",
    "full: requires a dedicated IBM i",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django's backend API is built on mutable class attributes (data_types,
# operators, django_test_skips, ...).
"django_db2_for_i/*.py" = ["RUF012"]
