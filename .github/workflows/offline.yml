# Offline tier + lint for every pull request and every push to main.
# Uses the "offline" image target only: no IBM software, no credentials.
name: offline

on:
  # Pushes to PR branches are covered by pull_request; running on every
  # branch push as well would run the job twice per PR update.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build offline image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: offline
          tags: django-db2-for-i-offline:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run as the runner's uid so the container can write .nox and tool
      # caches into the checked-out workspace.
      - name: nox -s lint offline
        run: >
          docker run --rm
          --user "$(id -u):$(id -g)"
          -e HOME=/tmp/home
          -e UV_CACHE_DIR=/tmp/uv-cache
          -v "$PWD:/workspace"
          -w /workspace
          django-db2-for-i-offline:ci
          nox -s lint offline
