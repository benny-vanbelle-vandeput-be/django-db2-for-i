# Project status data, rendered into README.md ("Project status") and the
# header of docs/TEST_STATUS.md by scripts/update_test_status.py.
#
# Update this file at every module or phase transition, then regenerate:
#     docker compose run --rm tests nox -s test_status
#
# status values: "done", "in progress", "planned".

[versions]
# Static badges and the TEST_STATUS.md header.
django = "6.1 | 6.0, 5.2 planned"
python = "3.12 | 3.13 | 3.14"
ibmi = "7.5"
# The system the recorded Django test runs used.
test_system = "PUB400"

[[releases]]
tag = "v0.1.0a3"
date = "2026-10-20"
summary = "Phase 2: queries & pagination (release run: 7 Django modules, 1249 tests, 0 failed)."

[[releases]]
tag = "v0.1.0a2"
date = "2026-10-18"
summary = "Encoding fixes (UTF-8 statement text, long strings intact) and the signed-tag release workflow."

[[releases]]
tag = "v0.1.0a1"
date = "2026-10-17"
summary = "Phase 1: minimal backend (its code reports version 0.0.1.dev0)."

[[phases]]
phase = "0"
content = "Skeleton & environment"
status = "done"

[[phases]]
phase = "1"
content = "Minimal backend"
status = "done"

[[phases]]
phase = "2"
content = "Queries & pagination (ordering, lookup, aggregation, expressions, queries)"
status = "done"

[[phases]]
phase = "3"
content = "Django 6.0 and 5.2 support (plan approved: docs/phases/phase-3.md)"
status = "planned"

[[phases]]
phase = "4"
content = "Schema editor completeness"
status = "planned"

[[phases]]
phase = "5"
content = "Returning & bulk"
status = "planned"

[[phases]]
phase = "6"
content = "Advanced (window functions, JSONField, db functions, DB-level on_delete)"
status = "planned"

[[phases]]
phase = "7"
content = "PUB400 tier & release prep"
status = "planned"

[[phases]]
phase = "Encoding track"
content = "CCSID / UTF-8 investigation, findings A/B/C (released in 0.1.0a2)"
status = "done"

# The modules table in README ("Project status"): the supported Django test
# modules (the release run's list), one column per Django version in
# [modules_section] django. Tests and results come from the logs in
# test-results/; a version without a run shows "planned".
[modules_section]
title = "Phase 3: supported modules per Django version"
django = ["6.1", "6.0", "5.2"]

[[modules]]
module = "basic"
status = "planned"

[[modules]]
module = "transactions"
status = "planned"

[[modules]]
module = "ordering"
status = "planned"

[[modules]]
module = "lookup"
status = "planned"

[[modules]]
module = "aggregation"
status = "planned"

[[modules]]
module = "expressions"
status = "planned"

[[modules]]
module = "queries"
status = "planned"
# Run as these labels (Q1-Q5); the module row sums their logs.
labels = [
    "queries.test_q",
    "queries.test_query",
    "queries.test_sqlcompiler",
    "queries.test_contains",
    "queries.test_iterator",
    "queries.test_explain",
    "queries.test_qs_combinators",
    "queries.test_db_returning",
    "queries.test_bulk_update",
    "queries.tests",
]
note = "split into labels Q1–Q5 because of its size"

