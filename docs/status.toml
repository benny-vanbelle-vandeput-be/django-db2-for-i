# Project status data, rendered into README.md (badges, "Test status",
# "Project status") and docs/TEST_STATUS.md by scripts/update_test_status.py.
#
# Update this file at every module or phase transition, then regenerate:
#     docker compose run --rm tests nox -s test_status
#
# status values (phases, steps, modules): "done", "in progress", "planned".

[versions]
# The system the recorded IBM i test runs used.
test_system = "PUB400"

# README's general badges: one per version, with its state.
# state: "supported", "development" (in development), "planned", "unsupported".
# eol = "YYYY-MM": end of security support (djangoproject.com/download); after
# that month a supported version is shown as end of life (⚠️) until dropped.
# Supported and in-development Django versions get a "Test status" section.

