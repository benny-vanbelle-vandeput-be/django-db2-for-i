# One-line, plain-language descriptions of Django's DatabaseFeatures flags,
# for docs/FEATURES.md (scripts/features.py, nox -s features).
#
# Per flag:
#   description = what the flag means for users
#   off         = why it is intentionally off (only for flags that are off)
#   planned     = the phase it is planned for (only for flags that are off)
#   not_applicable = which database or driver the flag belongs to (only for
#                 flags that are off)
# A flag that is off in every supported Django version has exactly one of
# off / planned / not_applicable, a flag that is on has none of them, and
# every listed flag has a description (offline test). "(not verified on IBM
# i)" marks a reason that rests on Db2 for i knowledge that no probe has
# confirmed yet. Values come from docs/features/<django>.json, never from
# this file.

# Django versions still in development in this backend (🚧 in the column header).
development = []

[flags]

