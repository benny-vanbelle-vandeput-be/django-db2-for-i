# unixODBC driver registration for the IBM i Access ODBC Driver (64-bit only).
#
# The ibm-iaccess package registers "IBM i Access ODBC Driver" with
# Driver=/opt/ibm/iaccess/lib/... (32-bit, not shipped in the amd64 package)
# and Driver64=/opt/ibm/iaccess/lib64/.... This file replaces that registration
# so the common driver name points at the 64-bit library unambiguously.
# Values taken from /opt/ibm/iaccess/unixodbcregistration (ibm-iaccess 1.1.0.29).

[IBM i Access ODBC Driver]
Description = IBM i Access for Linux ODBC Driver (64-bit)
Driver      = /opt/ibm/iaccess/lib64/libcwbodbc.so
Setup       = /opt/ibm/iaccess/lib64/libcwbodbcs.so
Threading   = 0
DontDLClose = 1
